server {
    address = "0.0.0.0"
    port = 8080            # binding ports below 1024 requires root
    runInBackground = false
    httpsRedirect = false
    behindProxy = false    # trust X-Forwarded-For only behind a known reverse proxy

    tls {
        enabled = false
        port = 8443
        keyStorePath = ""
        keyStorePassword = ""
        keyAlias = "tulpar"
        privateKeyPassword = ""
    }
}

repo {
    root = "./repo-data"   # directory holding pool/ and the generated repodata.json
    defaultChannel = "main"
    reindexOnStart = true
}

limits {
    maxRequestsPerWindow = 120
    windowMillis = 60000
    banDurationMillis = 60000
    maxDownloadsPerIP = 4
    maxDownloadSpeed = 0   # bytes/sec, 0 = unlimited
    bufferSize = 65536
    exemptLoopback = true
}

publish {
    enabled = false
    tokens = []            # Bearer tokens for publish/delete; may reference env vars: [${TULPAR_PUBLISH_TOKEN}]
    validate = true
    requireSignature = false
    keyringDir = ""        # directory of trusted *.key files (32 raw Ed25519 public key bytes), libAPG format
    allowOverwrite = false
    maxUploadBytes = 4294967296      # hard cap on one uploaded .apg (4 GiB)
    maxSignatureBytes = 4096         # hard cap on one uploaded .sig
}

metrics {
    enabled = true
    intervalMillis = 300000
}

cli {
    color = "#cccccc"
    hello = [
        "▀█▀ █░█ █░░ █▀█ ▄▀█ █▀█ ▄▄ █▀ █▀▀ █▀█ █░█ █▀▀ █▀█   ▀█ ░ █▀█",
        "░█░ █▄█ █▄▄ █▀▀ █▀█ █▀▄ ░░ ▄█ ██▄ █▀▄ ▀▄▀ ██▄ █▀▄   █▄ ▄ █▄█"
    ]
}
