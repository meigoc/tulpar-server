server {
    address = "0.0.0.0"
    port = 8080            # для портов ниже 1024 нужен root (например порт 80)
    runInBackground = false
    httpsRedirect = false
    behindProxy = false    # доверять X-Forwarded-For только за известным reverse proxy

    tls {
        enabled = false
        port = 8443
        keyStorePath = ""
        keyStorePassword = ""
        keyAlias = "tulpar"
        privateKeyPassword = ""
    }
}

repo {
    root = "./repo-data"   # каталог с pool/ и сгенерированным repodata.json
    defaultChannel = "main"
    reindexOnStart = true
}

limits {
    maxRequestsPerWindow = 120
    windowMillis = 60000
    banDurationMillis = 60000
    maxDownloadsPerIP = 4
    maxDownloadSpeed = 0   # байт/с, 0 = без ограничения
    bufferSize = 65536
    exemptLoopback = true
}

publish {
    enabled = false
    tokens = []            # Bearer-токены для publish/delete
    validate = true
    requireSignature = false
    allowOverwrite = false
}

metrics {
    enabled = true
    intervalMillis = 300000
}

cli {
    color = "#cccccc"
    hello = [
        "▀█▀ █░█ █░░ █▀█ ▄▀█ █▀█ ▄▄ █▀ █▀▀ █▀█ █░█ █▀▀ █▀█   ▀█ ░ █▀█",
        "░█░ █▄█ █▄▄ █▀▀ █▀█ █▀▄ ░░ ▄█ ██▄ █▀▄ ▀▄▀ ██▄ █▀▄   █▄ ▄ █▄█"
    ]
}
